<script>
  /* intro: plays every time the site is loaded on the home page. ?intro in the URL forces it (for testing) */
  try {
    var page = location.hash.replace(/^#\/?/, '').split('/')[0], q = location.search;
    if (!/[?&]still/.test(q) && (page === '' || /[?&]intro/.test(q))) {
      document.documentElement.classList.add('intro');
      /* the intro always starts at the top: stop the browser restoring the old scroll position on reload */
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    }
  } catch (e) {}
</script>
